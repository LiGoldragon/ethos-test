[package]
name = "ethos-test-harness"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[features]
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "5cd62196d07ab52c69b6ed287510fa310c1838e7", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
